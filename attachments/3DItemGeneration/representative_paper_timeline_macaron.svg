<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title desc">
  <title id="title">Representative CAD, B-Rep, Design-Intent and Articulated 3D Paper Timeline</title>
  <desc id="desc">A macaron-colored timeline from 2018 to 2026, organized into CAD program, B-Rep surface, design-intent constraint, articulated asset, and agentic feedback branches.</desc>
  <defs>
    <style>
      .bg{fill:#fffdf8}.title{font:700 34px Inter,"Noto Sans SC",sans-serif;fill:#354052}.sub{font:16px Inter,"Noto Sans SC",sans-serif;fill:#667085}.lane{font:700 18px Inter,"Noto Sans SC",sans-serif;fill:#354052}.year{font:700 16px Inter,sans-serif;fill:#596579}.paper{font:700 15px Inter,"Noto Sans SC",sans-serif;fill:#293548}.tech{font:13px Inter,"Noto Sans SC",sans-serif;fill:#536174}.small{font:12px Inter,"Noto Sans SC",sans-serif;fill:#667085}.axis{stroke:#9aa7b8;stroke-width:3}.tick{stroke:#9aa7b8;stroke-width:2}.guide{stroke:#d9dee8;stroke-width:1;stroke-dasharray:5 7}.new{stroke:#de7f86;stroke-width:3}.base{stroke:#ffffff;stroke-width:2}.connector{stroke:#9aa7b8;stroke-width:1.5}.star{font:700 15px Inter,sans-serif;fill:#c85e6a}
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#516071" flood-opacity=".13"/></filter>
  </defs>
